appId: dev.vayntforge.desktop
productName: Vaynt Forge
copyright: Copyright © Vaynt Forge
# electron-builder derives this from package.json's "name" by default, which
# is the scoped npm name "@vayntforge/desktop" — the "@" and "/" break Linux
# AppImage packaging ("characters that cannot be safely used in file paths"),
# caught by actually attempting a Linux build, not by reading docs.
executableName: vaynt-forge
# package.json pins electron to a "^44.3.0" range for normal dependency
# resolution, but electron-builder needs one exact version to know which
# prebuilt Electron binary to download/reuse — mirror whatever is actually
# installed (`node -e "console.log(require('electron/package.json').version)"`).
electronVersion: 44.3.0

directories:
  buildResources: build
  output: release

files:
  - out/**/*
  - package.json

extraMetadata:
  main: out/main/index.js

mac:
  category: public.app-category.developer-tools
  icon: build/icon.icns
  target:
    - target: dmg
      arch: [universal]
  # No Developer ID identity is configured yet — leave unsigned rather than
  # fake a signature. `CSC_IDENTITY_AUTO_DISCOVERY=false` stops electron-builder
  # from silently picking up an ad-hoc/unrelated cert from this machine's
  # keychain. Once a real Apple Developer ID cert exists, set
  # `mac.identity` (or CSC_LINK/CSC_KEY_PASSWORD env vars) and remove this.
  identity: null
  hardenedRuntime: true
  gatekeeperAssess: false

dmg:
  artifactName: '${productName}-${version}-${arch}.${ext}'

win:
  icon: build/icon.png
  target:
    - target: nsis
      arch: [x64]
  # No code-signing certificate configured yet (see mac.identity note above)
  # — electron-builder produces an unsigned NSIS installer, which Windows
  # SmartScreen will flag until a real cert is added via `win.certificateFile`
  # / `CSC_LINK`.
  signAndEditExecutable: false

nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  artifactName: '${productName}-Setup-${version}.${ext}'

linux:
  icon: build/icon.png
  category: Development
  target:
    - target: AppImage
      arch: [x64]

publish:
  provider: github
  owner: prakashiOrbit
  repo: vaynt-forge
